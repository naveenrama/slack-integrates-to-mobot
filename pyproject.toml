[project]
name = "mobot-in-slack"
version = "0.1.0"
description = "Slack Agent app bridging @mobot to Sumo Logic Copilot agents"
requires-python = ">=3.13"
dependencies = [
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "aiohttp>=3.9.0",
    "flask>=3.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "cryptography>=41.0.0",
    "aiosqlite>=0.19.0",
    "python-dotenv>=1.0.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["sumo*", "storage*", "routing*", "slack_handlers*"]

[tool.uv]
python-preference = "only-managed"
